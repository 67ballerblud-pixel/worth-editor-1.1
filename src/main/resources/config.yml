# ---------------------------------------------------------------
# WorthEditor config
# ---------------------------------------------------------------

# Path to the worth file your shop plugin reads, relative to the SERVER ROOT.
# CHANGE THIS to the real location of your worth.yml.
worth-file: "plugins/UltimateDonutSmp/worth.yml"

# Command run from console after the worth file is saved so your shop plugin
# re-reads it (e.g. "shop reload"). Leave empty to disable.
reload-command: ""   # e.g. "ultimatedonutsmp reload" - check what your plugin uses

engine:
  # Crafted item value = sum of ingredient values * this / amount crafted.
  # 1.0 means crafting never makes or loses money (no loops).
  craft-factor: 1.0
  # Smelted/cooked value = input value * this.
  smelt-factor: 1.1
  # Items with no raw value and no recipe keep the price they had the first
  # time the plugin saw them (their "baseline").

dynamic:
  # Enabled/disabled from the GUI too. This is only the default.
  enabled: false
  # How often prices are recalculated and saved.
  interval-minutes: 60
  # multiplier = base - slope * log10(1 + pressure), clamped to [min, max]
  # pressure = recorded sales + inventory-weight * amount held by online players.
  # Plentiful items drift down, scarce items drift up.
  base: 1.25
  slope: 0.15
  min: 0.6
  max: 1.5
  inventory-weight: 0.05
  # Sales pressure is multiplied by this every cycle (older sales matter less).
  sales-decay: 0.8
  broadcast: false

# Keeps sell prices BELOW what the shop charges to buy things, so nobody can
# buy -> sell (or buy -> craft -> sell) for profit. Applied by auto-balance and
# every dynamic cycle. It only ever lowers prices.
shop-cap:
  enabled: true
  # The shop plugin's file(s) holding BUY prices (relative to the server root).
  # CHANGE THIS. Run /worthedit shopcheck to see how many buy prices were read.
  buy-files:
    - "plugins/UltimateDonutSmp/shop.yml"
  # Sell price may be at most this fraction of the buy price (0.8 = 20% gap).
  sell-ratio: 0.8
  # Manual buy prices, win over the shop file. MATERIAL: price
  buy-prices: {}

